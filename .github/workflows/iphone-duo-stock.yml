name: iPhone Duo stock check
on:
  pull_request:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: iphone-duo-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/iphone-duo/requirements.txt
      - name: Inspect live page layout without sending alerts
        if: github.event_name == 'pull_request'
        run: python .github/iphone-duo/probe.py
      - name: Check stock and update notification issue
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/iphone-duo/check.py
