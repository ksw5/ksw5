name: iPhone Duo stock check
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/iphone-duo/**'
      - '.github/workflows/iphone-duo-stock.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: iphone-duo-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/iphone-duo/requirements.txt
      - name: Unit-test inventory parser
        run: python -m unittest discover -s .github/iphone-duo -p 'test_check.py' -v
      - name: Validate live data and local filtering without notifications
        if: github.event_name == 'pull_request'
        run: python .github/iphone-duo/check.py --dry-run
      - name: Check stock and update notification issue
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/iphone-duo/check.py --output data/apple-stock.json

      - name: Publish Apple dashboard snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/apple-stock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Apple stock snapshot"
            git pull --rebase origin main
            git push
          fi
