name: T-Mobile iPhone Duo availability
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '12,32,52 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: tmobile-duo-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/iphone-duo/requirements.txt
      - name: Probe public T-Mobile store pages (read only)
        if: github.event_name == 'pull_request'
        run: python .github/tmobile-duo/probe.py
