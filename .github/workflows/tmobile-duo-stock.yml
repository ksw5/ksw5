name: T-Mobile iPhone Duo availability
on:
  pull_request:
    paths:
      - '.github/tmobile-duo/**'
      - '.github/workflows/tmobile-duo-stock.yml'
  push:
    branches: [main]
    paths:
      - '.github/tmobile-duo/**'
      - '.github/workflows/tmobile-duo-stock.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: tmobile-duo-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/iphone-duo/requirements.txt
      - name: Test T-Mobile stock parser
        run: python -m unittest discover -s .github/tmobile-duo -p 'test_check.py' -v
      - name: Verify against real T-Mobile listings without notifications
        if: github.event_name == 'pull_request'
        run: python .github/tmobile-duo/check.py --dry-run
      - name: Check T-Mobile store stock and create alerts
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/tmobile-duo/check.py --output data/tmobile-stock.json
      - name: Publish dashboard observations
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f data/tmobile-stock.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tmobile-stock.json
            if ! git diff --cached --quiet; then
              git commit -m "Update T-Mobile stock observations"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
