name: T-Mobile iPhone Duo availability
on:
  pull_request:
    paths:
      - '.github/tmobile-duo/**'
      - '.github/workflows/tmobile-duo-stock.yml'
  push:
    branches: [main]
    paths:
      - '.github/tmobile-duo/**'
      - '.github/workflows/tmobile-duo-stock.yml'
  workflow_dispatch:
  schedule:
    - cron: '12,32,52 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: tmobile-duo-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/iphone-duo/requirements.txt
      - name: Test T-Mobile stock parser
        run: python -m unittest discover -s .github/tmobile-duo -p 'test_check.py' -v
      - name: Verify against real T-Mobile listings without notifications
        if: github.event_name == 'pull_request'
        run: python .github/tmobile-duo/check.py --dry-run
      - name: Check T-Mobile store stock and create alerts
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/tmobile-duo/check.py
